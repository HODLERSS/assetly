<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#F4F5F7">
  <script>
    /* Set the ground BEFORE first paint: reading the choice in React would flash
       the light page on a dark phone for one frame. */
    (function () {
      try {
        var t = localStorage.getItem("assetly-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        var dark = t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", dark ? "#0F1216" : "#F4F5F7");
        document.documentElement.style.colorScheme = t === "light" ? "light" : t === "dark" ? "dark" : "light dark";
      } catch (e) { /* private mode: system default is correct */ }
    })();
  </script>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <!-- The UI face is self-hosted (theme.css @font-face, public/fonts): nothing render-blocking leaves the
       device, and the app paints offline. The Latin file is preloaded so the first frame is already set in it. -->
  <link rel="preload" href="/assetly/fonts/schibsted-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    /* Korean glyphs: Noto Sans KR on the web only, and never render-blocking (it is megabytes of CJK and
       the page must not wait on it). The iOS app skips it: Apple SD Gothic Neo is already on the device. */
    (function () {
      if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) return;
      var l = document.createElement("link");
      l.rel = "stylesheet";
      l.href = "https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap";
      l.media = "print";
      l.onload = function () { l.media = "all"; };
      document.head.appendChild(l);
    })();
  </script>
  <meta name="description" content="Assetly tracks what you own across US and Korean markets and crypto, and writes you a short brief on what moved and why. Read it in two minutes or listen in ninety seconds.">
  <meta property="og:title" content="Assetly: Portfolio Brief">
  <meta property="og:description" content="Your holdings, priced live, explained in a two-minute brief you can read or listen to.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://hodlerss.github.io/assetly/">
  <meta property="og:image" content="https://hodlerss.github.io/assetly/icon-512.png">
  <title>Assetly</title>
  <script type="module" crossorigin src="/assetly/assets/index-cRurQ8U-.js"></script>
  <link rel="stylesheet" crossorigin href="/assetly/assets/index-C2MNJwoe.css">
</head>
<body>
  <!-- The boot state: static, inline, no JS and no asset. On a slow link the page was blank for ~9s until the
       bundle arrived (e2e p09-1). React replaces this the moment it mounts; the theme follows the device. -->
  <style>
    #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#F4F5F7;color:#2A3F92;font:700 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;letter-spacing:-.02em}
    #boot .bw{display:inline-flex;align-items:center;gap:10px}
    #boot .sp{width:22px;height:22px;border-radius:50%;border:2.5px solid rgba(42,63,146,.18);border-top-color:#2A3F92;animation:boot-spin .9s linear infinite}
    @keyframes boot-spin{to{transform:rotate(360deg)}}
    @media (prefers-color-scheme:dark){:root:not([data-theme=light]) #boot{background:#0F1216;color:#8AA0F2}:root:not([data-theme=light]) #boot .sp{border-color:rgba(138,160,242,.22);border-top-color:#8AA0F2}}
    :root[data-theme=dark] #boot{background:#0F1216;color:#8AA0F2}:root[data-theme=dark] #boot .sp{border-color:rgba(138,160,242,.22);border-top-color:#8AA0F2}
    @media (prefers-reduced-motion:reduce){#boot .sp{animation:none;opacity:.6}}
  </style>
  <div id="root"><div id="boot" role="status" aria-label="Loading Assetly"><span class="bw"><svg width="32" height="12" viewBox="0 0 32 12" aria-hidden="true"><rect x="0" y="3" width="14" height="6" rx="3" fill="currentColor"/><rect x="17" y="3" width="14" height="6" rx="3" fill="currentColor" opacity=".45"/></svg>Assetly</span><span class="sp" aria-hidden="true"></span></div></div>
</body>
</html>
